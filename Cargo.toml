[package]
name = "migracoder"
version = "0.10.0"
edition = "2024"
rust-version = "1.88"
description = "Move a workspace and repoint local Codex sessions to its new path"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_complete_nushell = "4.6"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
rusqlite = { version = "0.40", features = ["backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
walkdir = "2.5"

[profile.release]
strip = true
lto = "thin"
